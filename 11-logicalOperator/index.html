<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Logical Operator Journey</title>
</head>
<body>
    <label>Nama: </label>
    <input id="namaMahasiswa" type="text" placeholder="Nama Kamu"> <br> <br>

    <label>Nilai Akademik: </label>
    <input id="nilaiAkademik" type="number" placeholder="0-100"> <br> <br>

    <label>Penghasilan Orang Tua(rupiah): </label>
    <input id="penghasilanOrangTua" type="number" placeholder="Contoh: 1000000"> <br> <br>

    <label>Semester: </label>
    <input id="semester" type="number" placeholder="Semester Saat Ini"> <br> <br>

    <label>Status Mahasiswa: </label>
    <label>
        <input id="statusAktif" type="radio" name="status" value="aktif" checked>Aktif
    </label>
    <label>
        <input id="statusCuti" type="radio" name="status" value="cuti">Cuti
    </label> <br> <br>

    <button id="mySubmit">Submit</button>

    <pre id="lembarHasil"></pre>

    <script src="script.js"></script>
</body>
</html>
